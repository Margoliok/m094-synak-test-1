<title>М094 — Сынақ тесті №1</title>
<style>

    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);

  .btns{display:flex;gap:8px;flex-wrap:wrap}

  button:hover{border-color:var(--brand)}
  button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  button.primary:hover{filter:brightness(1.05)}
  .section-title{font-size:1.15rem;font-weight:700;margin:30px 0 6px;
    padding:12px 16px;background:var(--brand-soft);color:var(--brand);border-radius:12px}
  .section-note{color:var(--muted);font-size:.85rem;margin:0 0 8px 4px}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 6px;margin:14px 0;box-shadow:var(--shadow)}
  .q .num{display:inline-block;font-size:.78rem;font-weight:700;color:var(--brand);
    background:var(--brand-soft);padding:2px 10px;border-radius:20px;margin-bottom:8px}
  .q .multi{margin-left:8px;color:var(--muted);font-weight:600;background:transparent}
  .q .stem{font-weight:600;margin:2px 0 12px;white-space:pre-wrap}
  .q pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;overflow-x:auto;font-size:.86rem;margin:8px 0}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;margin:6px 0;
    border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.12s;
    background:var(--card)}

  .opt .letter{font-weight:700;color:var(--muted);min-width:20px}
  .opt input{margin-top:5px;accent-color:var(--brand);flex-shrink:0}
  .opt .txt{flex:1;white-space:pre-wrap;min-width:0;overflow-x:auto}
  .opt .txt.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:.84rem;line-height:1.45}

  .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}

  .opt.disabled{cursor:default}
  .expl{margin:10px 2px 12px;padding:12px 14px;border-radius:10px;
    background:var(--brand-soft);font-size:.9rem;display:none;white-space:pre-wrap}
  .expl.show{display:block}
  .expl b{color:var(--brand)}
  .mark{font-weight:700;margin-left:8px;font-size:.85rem}
  .mark.ok{color:var(--ok)} .mark.bad{color:var(--bad)} .mark.part{color:var(--warn)}

  footer{text-align:center;color:var(--muted);font-size:.82rem;margin-top:30px}

   e:"\\% — экрандалған, әдеттегі литерал % таңбасы; соңғы % — кез келген символдар. Демек жол \"ab%cd\" тіркесінен басталады.\n⚠ Ескерту: кері қиғаш сызық экрандау таңбасы ретінде MySQL-де әдепкі бойынша жұмыс істейді; SQL стандартында және PostgreSQL-де ол үшін ESCAPE '\\' деп нақты көрсету керек."},

   e:"Проект пен жұмысшыны Pnum=Pno арқылы байланыстырып COUNT(*) санайды. B артық HAVING шектеуін қосады, C/D-да == (SQL-де жоқ) және COUNT жақшасыз, E-да жоқ баған, F-та артық EMPLOYEE қосылуы мен Dno=5 сүзгісі.\n⚠ Тесттің кемшілігі: «әр проект үшін» деген талап GROUP BY Pnum, Pname-ді міндет етеді, бірақ бірде-бір нұсқада GROUP BY жоқ. A — қалғандарын шығарып тастау арқылы таңдалған жалғыз жарамды нұсқа."},

  {q:"UNIQUE кілттік сөзін қолданып, 2021 жылы бір рет қана оқылған пәндер",
   o:["SELECT T.CourseId\nFROM COURSE AS T\nWHERE UNIQUE (SELECT R.CourseId\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId OR R.Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE NOT UNIQUE (SELECT R.CourseId\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId AND R.Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE SOME (SELECT R.CourseId\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId AND R.Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE UNIQUE (SELECT R.CourseId\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId AND R.Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE UNIQUE (SELECT CourseId\n  FROM SECTION AS R\n  WHERE CourseId = CourseId AND Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE UNION(SELECT R.CourseId\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId AND R.Year = 2021);"],a:[3],
   e:"UNIQUE предикаты ішкі сұраныс нәтижесінде қайталанатын жол болмаса true қайтарады — яғни пән 2021 жылы бір-ақ рет оқылған. Корреляция (T.CourseId = R.CourseId) және жыл сүзгісі (R.Year = 2021) AND арқылы дұрыс қосылған жалғыз нұсқа — D. A-да OR, B-да NOT UNIQUE (керісінше), C-да SOME, E-де корреляция жоқ (CourseId = CourseId), F-та UNION предикат емес."},
  {q:"2021 жылы бір рет қана оқылған пәндер",
   o:["SELECT T.CourseId\nFROM COURSE AS T\nWHERE 1 <= (SELECT COUNT(R.CourseId)\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId AND R.Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE 1 <= (SELECT COUNT(R.CourseId)\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId OR\n  R.Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE 1 <= (SELECT COUNT(R.CourseId)\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE 1 <= (SELECT COUNT(R.CourseId)\n  FROM SECTION AS R\n  WHERE T.CourseId = R.CourseId OR R.Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE 1 <= (SELECT COUNT(R.CourseId)\n  FROM SECTION AS R\n  WHERE CourseId = CourseId AND Year = 2021);",
      "SELECT T.CourseId\nFROM COURSE AS T\nWHERE 1 <= (SELECT COUNT(R.CourseId)\n  FROM SECTION AS R\n  WHERE R.Year = 2021);"],a:[0],
   e:"Ішкі сұраныста корреляция да (T.CourseId = R.CourseId), жыл сүзгісі де (R.Year = 2021) AND арқылы дұрыс орналасқан жалғыз нұсқа — A. C-да жыл жоқ, F-та курс корреляциясы жоқ, E-де корреляция жалған (CourseId = CourseId), B/D-да AND орнына OR.\n⚠ Тесттің кемшілігі: сұрақта «бір рет қана» делінген, бұл 1 = COUNT(...) дегенді талап етеді, ал барлық алты нұсқада 1 <= COUNT(...), яғни «кемінде бір рет» жазылған. Нұсқалар тек ішкі сұраныстың шарты бойынша ажыратылады."},
  {q:"Философия пәнінің кодынан 1 санға кем сабақ туралы ақпарат",

      "логикалық бөлінетін мәндерге ие",
      "логикалық емес бөлінбейтін мәндерге ие қатынас"],a:[3],
   e:"Скалярлық (атомарлы) қатынас — әр ұяшықта бір ғана бөлінбейтін мән болады.\n⚠ Ескерту: бұл нұсқаның мәтіні 18-сұрақтағы 1НФ жауабымен сөзбе-сөз бірдей — тестте скалярлық қатынас пен 1НФ бір анықтама арқылы берілген."},
  {q:"Денормалауда пайда болатын аномалия",
   o:["іздеу аномалиясы","өзгерту аномалиясы","қосылу аномалиясы","енгізу аномалиясы","сұрыптау аномалиясы","жою аномалиясы","байланыс аномалиясы"],a:[1,3,5],
   e:"Классикалық үш аномалия: енгізу (insert), өзгерту/жаңарту (update), жою (delete). Іздеу, сұрыптау, қосылу және байланыс аномалиясы деген ұғымдар жоқ."}
 ]}
];

const LET="ABCDEFGH";
const quizEl=document.getElementById('quiz');
let total=0;
let gi=0; // global question index

DATA.forEach(section=>{
  const st=document.createElement('div');
  st.className='section-title';
  st.textContent=section.sec;
  quizEl.appendChild(st);
  const sn=document.createElement('p');
  sn.className='section-note';
  sn.textContent=section.note;
  quizEl.appendChild(sn);

  section.qs.forEach(item=>{
    total++;
    const idx=gi++;
    // Бөлімде multiSel болса — барлық сұрақ checkbox (дұрыс жауап саны бір болса да),
    // әйтпесе жауап саны бойынша анықталады.
    const multi=section.multiSel===true||item.a.length>1;
    const card=document.createElement('div');
    card.className='q';
    card.dataset.idx=idx;
    card.dataset.ans=item.a.join(',');
    card.dataset.multi=multi?'1':'0';

    let html=`<span class="num">Сұрақ №${idx+1}</span>`;
    // Дұрыс жауап санын алдын ала ашып қоймау үшін бөлімдік multiSel-де белгі көрсетілмейді.
    if(multi&&!section.multiSel) html+=`<span class="multi">(бірнеше жауап)</span>`;
    html+=`<div class="stem">${escapeHtml(item.q)}</div>`;
    if(item.code) html+=`<pre>${escapeHtml(item.code)}</pre>`;
    item.o.forEach((opt,i)=>{
      const type=multi?'checkbox':'radio';
      const mono=opt.includes('\n')?' mono':''; // көп жолды SQL нұсқалары моноенді қаріппен
      html+=`<label class="opt" data-i="${i}">
        <input type="${type}" name="q${idx}" value="${i}">
        <span class="letter">${LET[i]}</span>
        <span class="txt${mono}">${escapeHtml(opt)}</span>
      </label>`;
    });
    html+=`<div class="expl"><b>Түсіндірме.</b> ${escapeHtml(item.e)}</div>`;
    card.innerHTML=html;
    quizEl.appendChild(card);
  });
});
document.getElementById('total').textContent=total;

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// 0.25 сияқты бөлшек ұпайды артық нөлсіз көрсету
function fmt(n){return Number(n.toFixed(2)).toString();}

function clearMark(card){
  const m=card.querySelector('.mark');
  if(m) m.remove();
}

/**
 * Ішінара ұпай: әр дұрыс белгі +1/N, әр артық (қате) белгі −1/N, мұндағы N — дұрыс
 * жауаптар саны. Ұпай 0-ден төмен түспейді. Бір жауапты сұрақта бұл ескі мінез-құлықпен
 * бірдей: дұрыс = 1, қате немесе бос = 0.
 */
function gradeCard(card,revealOnly){
  const ans=card.dataset.ans.split(',').map(Number);
  const opts=[...card.querySelectorAll('.opt')];
  const chosen=[...card.querySelectorAll('input:checked')].map(i=>Number(i.value));
  opts.forEach(o=>{
    const i=Number(o.dataset.i);
    o.classList.remove('correct','wrong');
    o.classList.add('disabled');
    o.querySelector('input').disabled=true;
    if(ans.includes(i)) o.classList.add('correct');
    else if(chosen.includes(i)) o.classList.add('wrong');
  });
  card.querySelector('.expl').classList.add('show');
  clearMark(card);
  if(revealOnly) return null;

  const hit=chosen.filter(c=>ans.includes(c)).length;
  const extra=chosen.length-hit;
  const pts=Math.max(0,(hit-extra)/ans.length);

  const mark=document.createElement('span');
  mark.className='mark '+(pts===1?'ok':pts===0?'bad':'part');
  mark.textContent=pts===1?'+1':(pts===0?'0':'+'+fmt(pts));
  card.querySelector('.num').insertAdjacentElement('afterend',mark);
  return pts;
}

document.getElementById('check').addEventListener('click',()=>{
  let score=0;
  document.querySelectorAll('.q').forEach(card=>{
    score+=gradeCard(card,false);
  });
  document.getElementById('score').textContent=fmt(score);
  window.scrollTo({top:0,behavior:'smooth'});
});

document.getElementById('reveal').addEventListener('click',()=>{
  document.querySelectorAll('.q').forEach(card=>gradeCard(card,true));
  document.getElementById('score').textContent='—';
});

document.getElementById('reset').addEventListener('click',()=>{
  document.querySelectorAll('.q').forEach(card=>{
    card.querySelectorAll('.opt').forEach(o=>{
      o.classList.remove('correct','wrong','disabled');
      const inp=o.querySelector('input'); inp.disabled=false; inp.checked=false;
    });
    card.querySelector('.expl').classList.remove('show');
    clearMark(card);
  });
  document.getElementById('score').textContent='0';
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
